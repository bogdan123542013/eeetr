<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaBot — Telegram-бот</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
      background: #1e293b;
      border-radius: 20px;
    }
    h1 { color: #60a5fa; }
    p { line-height: 1.7; color: #d1d5db; }
    a {
      display: inline-block;
      background: #229ed9;
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🤖 MegaBot</h1>
    <p>Добро пожаловать на сайт нашего Telegram-бота!</p>
    <p>Узнавай о возможностях бота и следи за новостями проекта.</p>
    <a href="https://t.me/" target="_blank">Открыть Telegram</a>
  </div>
</body>
</html>
